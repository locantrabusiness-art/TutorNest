<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor Login | TutorNest</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#0f4c81,#1d7bd7);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:380px;
    background:#fff;
    border-radius:15px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#0f4c81;
}

h2{
    text-align:center;
    margin:10px 0 25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#0f4c81;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0b3b63;
}

.google-btn{
    margin-top:12px;
    background:#ffffff;
    color:#333;
    border:1px solid #ccc;
}

.google-btn:hover{
    background:#f5f5f5;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    text-decoration:none;
    color:#0f4c81;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">TutorNest</div>

<h2>Tutor Login</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<button
class="google-btn"
id="googleLogin">
Continue with Google
</button>

<div class="links">

<p>
<a href="#">Forgot Password?</a>
</p>

<p>
New Tutor?
<a href="tutor-register.html">
Register Here
</a>
</p>

</div>

</div>

<script type="module" src="js/tutor-login.js"></script>
</body>
</html>
