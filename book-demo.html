<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Free Demo | TutorNest</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/book-demo.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<section class="form-section">

<div class="demo-container">

<h1>📚 Book Free Demo</h1>

<p>

Fill the form below. Our team will contact you shortly and assign the best tutor.

</p>

<form id="demoForm" class="demo-form">

<input
type="text"
id="studentName"
placeholder="Student Name"
required>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

<select id="class" required>

<option value="">Select Class</option>

<option>Nursery</option>
<option>LKG</option>
<option>UKG</option>

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>

</select>

<input
type="text"
id="subject"
placeholder="Subject"
required>

<input
type="text"
id="area"
placeholder="Area / Locality"
required>

<input
type="text"
id="preferredTime"
placeholder="Preferred Time (Morning / Evening)">

<textarea
id="message"
placeholder="Any special requirements (Optional)"></textarea>

<button
type="submit"
class="demo-btn">

<i class="fa-solid fa-calendar-check"></i>

Book Free Demo

</button>

</form>

<div class="demo-note">

<p>✅ Your request will first be verified by TutorNest.</p>

<p>👨‍🏫 We personally match you with the best tutor.</p>

<p>📞 Our team will contact you shortly.</p>

</div>

</div>

</section>

<script type="module" src="js/book-demo.js"></script>

</body>

</html>
