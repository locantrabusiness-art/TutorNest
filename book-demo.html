<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Book Free Demo | TutorNest</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
display:flex;
justify-content:center;
padding:40px;
}

form{
background:white;
padding:30px;
border-radius:15px;
width:500px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

input,
select,
textarea{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;

}

button{

width:100%;
padding:14px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
cursor:pointer;

}

</style>

</head>

<body>

<form id="demoForm">

<h2>Book Free Demo</h2>

<input
id="studentName"
placeholder="Student Name"
required>

<input
id="parentName"
placeholder="Parent Name">

<input
id="phone"
placeholder="Phone Number"
required>

<input
id="city"
placeholder="City"
required>

<select id="class">

<option>Class 1</option>
<option>Class 2</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>
<option>Class 11</option>
<option>Class 12</option>

</select>

<input
id="subject"
placeholder="Subject">

<textarea
id="message"
placeholder="Anything else?">
</textarea>

<button>

Book Free Demo

</button>
<input type="hidden" id="tutorId">
<input type="hidden" id="tutorName">
</form>

<script type="module" src="js/book-demo.js"></script>

</body>

</html>
