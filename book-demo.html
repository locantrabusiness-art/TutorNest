<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/book-demo.css">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Free Demo | TutorNest</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<section class="form-section">

<div class="form-card">

<h2>Book Free Demo</h2>

<p>
Submit your request. Our team will contact you and assign the best tutor.
</p>

<form id="demoForm" class="demo-form">

<input
type="text"
id="studentName"
placeholder="Student Name"
required>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

<select id="class" required>

<option value="">Select Class</option>

<option>Nursery</option>
<option>LKG</option>
<option>UKG</option>

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>

</select>

<input
type="text"
id="subject"
placeholder="Subject"
required>

<input
type="text"
id="area"
placeholder="Area"
required>

<input
type="text"
id="preferredTime"
placeholder="Preferred Time (Morning / Evening)">

<textarea
id="message"
placeholder="Any special requirement"></textarea>

<button type="submit" class="demo-btn">
Book Free Demo

</button>
<div class="demo-note">

✅ Your request will first be verified by TutorNest.

👨‍🏫 We personally match you with the best tutor.

📞 Our team will contact you shortly.

</div>

</form>

</div>

</section>

<script type="module" src="js/book-demo.js"></script>

</body>

</html>
