<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Teachers | TutorNest</title>

<link rel="stylesheet" href="css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

header{
background:#0d6efd;
padding:60px 20px;
text-align:center;
color:white;
}

header h1{
font-size:42px;
margin-bottom:10px;
}

header p{
opacity:.9;
}

.filters{
max-width:1200px;
margin:30px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:0 20px;
}

.filters input,
.filters select{
padding:13px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
font-size:15px;
}

#teachersContainer{
max-width:1200px;
margin:30px auto;
padding:0 20px 50px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.teacher-card{
background:white;
border-radius:18px;
padding:20px;
text-align:center;
box-shadow:0 8px 25px rgba(0,0,0,.08);
transition:.3s;
}

.teacher-card:hover{
transform:translateY(-5px);
}

.teacher-photo{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
border:4px solid #0d6efd;
}

.teacher-card h2{
margin-bottom:8px;
}

.teacher-card p{
margin:5px 0;
color:#555;
}

.teacher-card button{
margin-top:15px;
padding:12px 20px;
border:none;
background:#0d6efd;
color:white;
border-radius:8px;
cursor:pointer;
}

.teacher-card button:hover{
background:#0047b3;
}

.badge{
display:inline-block;
padding:5px 12px;
border-radius:20px;
background:#e8f1ff;
color:#0d6efd;
font-size:13px;
margin-bottom:10px;
font-weight:bold;
}

.empty{
grid-column:1/-1;
text-align:center;
font-size:22px;
padding:80px;
color:#777;
}

</style>

</head>

<body>

<header>

<h1>Explore Teachers</h1>

<p>Find the perfect tutor for your child</p>

</header>

<div class="filters">

<input
id="searchTeacher"
placeholder="Search by name">

<select id="subjectFilter">
<option value="">All Subjects</option>
</select>

<select id="classFilter">
<option value="">All Classes</option>
</select>

<select id="modeFilter">
<option value="">Teaching Mode</option>
<option>Home</option>
<option>Online</option>
<option>Both</option>
</select>

<select id="genderFilter">
<option value="">Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<select id="sortFilter">
<option value="">Sort</option>
<option value="feesLow">Fees Low → High</option>
<option value="feesHigh">Fees High → Low</option>
<option value="experience">Most Experienced</option>
</select>

</div>

<div id="teachersContainer">

<div class="empty">

Loading Teachers...

</div>

</div>

<script type="module" src="js/teachers.js"></script>

</body>
</html>
