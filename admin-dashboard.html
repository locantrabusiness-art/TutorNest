<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TutorNest Admin Dashboard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f7fb;
        }

        header{
            background:#0056d2;
            color:white;
            padding:20px;
            font-size:24px;
            font-weight:bold;
        }

        .container{
            width:95%;
            margin:25px auto;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
            text-align:center;
        }

        .card h2{
            color:#0056d2;
            font-size:34px;
            margin-top:10px;
        }

        .toolbar{
            display:flex;
            gap:15px;
            margin-bottom:20px;
            flex-wrap:wrap;
        }

        .toolbar input,
        .toolbar select{

            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            width:250px;

        }

        table{

            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 5px 15px rgba(0,0,0,.08);

        }

        th{

            background:#0056d2;
            color:white;
            padding:15px;

        }

        td{

            padding:14px;
            border-bottom:1px solid #eee;
            text-align:center;

        }

        tr:hover{

            background:#f8f8f8;

        }

        button{

            padding:8px 14px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            margin:2px;
            color:white;

        }

        .approve{

            background:#28a745;

        }

        .reject{

            background:#dc3545;

        }

        .show{

            background:#0d6efd;

        }

        .feature{

            background:#ff9800;

        }

        .delete{

            background:#444;

        }

        img{

            width:55px;
            height:55px;
            border-radius:50%;
            object-fit:cover;

        }

        @media(max-width:900px){

            table{

                display:block;
                overflow-x:auto;

            }

        }

    </style>

</head>

<body>

<header>

TutorNest Admin Dashboard

</header>

<div class="container">

<div class="cards">

<div class="card">

<h4>Total Tutors</h4>

<h2 id="totalTutors">0</h2>

</div>

<div class="card">

<h4>Pending</h4>

<h2 id="pendingTutors">0</h2>

</div>

<div class="card">

<h4>Approved</h4>

<h2 id="approvedTutors">0</h2>

</div>

<div class="card">

<h4>Featured</h4>

<h2 id="featuredTutors">0</h2>

</div>

</div>

<div class="toolbar">

<input
type="text"
id="searchBox"
placeholder="Search Tutor...">

<select id="filterStatus">

<option value="">All Tutors</option>

<option value="pending">Pending</option>

<option value="approved">Approved</option>

<option value="rejected">Rejected</option>

</select>

</div>

<table>

<thead>

<tr>

<th>Photo</th>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Status</th>

<th>Visible</th>

<th>Featured</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="teacherTable">

</tbody>

</table>

</div>

<script type="module" src="js/admin.js"></script>

</body>

</html>
