<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | TutorNest</title>

<link rel="stylesheet" href="css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

header{
background:#0d6efd;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h2{
font-size:26px;
}

#logoutBtn{
padding:10px 18px;
border:none;
background:#fff;
color:#0d6efd;
font-weight:bold;
border-radius:8px;
cursor:pointer;
}

.container{
max-width:1400px;
margin:30px auto;
padding:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:35px;
}

.stat-card{
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
text-align:center;
}

.stat-card h3{
font-size:18px;
color:#666;
margin-bottom:12px;
}

.stat-card h1{
font-size:42px;
color:#0d6efd;
}

.search{
margin-bottom:25px;
}

.search input{
width:100%;
padding:15px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

.section{
margin-top:40px;
}

.section h2{
margin-bottom:15px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.tutor-card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.tutor-card img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
}

.tutor-card h3{
margin-bottom:8px;
}

.tutor-card p{
margin:5px 0;
color:#555;
}

.actions{
margin-top:15px;
display:flex;
flex-wrap:wrap;
gap:10px;
}

.actions button{
padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.approve{
background:#28a745;
color:white;
}

.reject{
background:#dc3545;
color:white;
}

.feature{
background:#ff9800;
color:white;
}

.delete{
background:#333;
color:white;
}

.remove{
background:#6c757d;
color:white;
}

</style>

</head>

<body>

<header>

<h2>TutorNest Admin</h2>

<button id="logoutBtn">
Logout
</button>

</header>

<div class="container">

<div class="stats">

<div class="stat-card">
<h3>Total Tutors</h3>
<h1 id="totalTutors">0</h1>
</div>

<div class="stat-card">
<h3>Pending</h3>
<h1 id="pendingTutors">0</h1>
</div>

<div class="stat-card">
<h3>Approved</h3>
<h1 id="approvedTutors">0</h1>
</div>

<div class="stat-card">
<h3>Featured</h3>
<h1 id="featuredTutors">0</h1>
</div>

</div>

<div class="search">
<input
type="text"
id="searchInput"
placeholder="Search tutor...">
</div>

<div class="section">

<h2>Pending Tutors</h2>

<div
class="cards"
id="pendingList">

Loading...

</div>

</div>

<div class="section">

<h2>Approved Tutors</h2>

<div
class="cards"
id="approvedList">

Loading...

</div>

</div>

<div class="section">

<h2>Rejected Tutors</h2>

<div
class="cards"
id="rejectedList">

Loading...

</div>

</div>

</div>

<script type="module" src="js/admin.js"></script>

</body>
</html>
