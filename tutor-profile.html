<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complete Tutor Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f5f9;
}

.container{

width:90%;
max-width:900px;
margin:40px auto;

background:white;

padding:30px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}

h2{

text-align:center;
margin-bottom:25px;
color:#0d6efd;

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}

input,
select,
textarea{

width:100%;
padding:12px;

border:1px solid #ccc;

border-radius:8px;

}

textarea{

height:120px;
resize:none;

}

button{

margin-top:30px;

width:100%;

padding:15px;

background:#0d6efd;

color:white;

font-size:18px;

border:none;

border-radius:10px;

cursor:pointer;

}

button:hover{

background:#0049b7;

}

</style>

</head>

<body>

<div class="container">

<h2>Complete Tutor Profile</h2>

<form id="profileForm">

<div class="grid">

<input type="text" id="name" placeholder="Full Name" required>

<input type="text" id="phone" placeholder="Mobile Number">

<input type="text" id="qualification" placeholder="Qualification">

<input type="number" id="experience" placeholder="Experience (Years)">

<input type="text" id="subjects" placeholder="Subjects (Maths, Physics...)">

<input type="text" id="classes" placeholder="Classes (6-10,11-12)">

<input type="text" id="board" placeholder="Board (CBSE/ICSE/UP)">

<input type="text" id="mode" placeholder="Home / Online / Both">

<input type="text" id="area" placeholder="Teaching Area">

<input type="number" id="fees" placeholder="Fees Per Hour">

</div>

<br>

<textarea
id="about"
placeholder="Write about yourself"></textarea>
<h3>Profile Photo</h3>

<input
type="file"
id="photo"
accept="image/*">

<br><br>

<img
id="preview"
src="assets/logo/logo.png"
width="150"
style="border-radius:50%;object-fit:cover;">

<button type="submit">

Save Profile

</button>

</form>

</div>

<script type="module" src="js/profile.js"></script>

</body>
</html>
