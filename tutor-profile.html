<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complete Tutor Profile | TutorNest</title>

<link rel="stylesheet" href="css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding:30px;
}

.container{

max-width:950px;
margin:auto;
background:#fff;
padding:30px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.08);

}

h2{

text-align:center;
margin-bottom:25px;
color:#0f4c81;

}

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;

}

input,
select,
textarea{

width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
outline:none;
transition:.3s;

}

input:focus,
select:focus,
textarea:focus{

border-color:#0f4c81;

}

textarea{

height:120px;
resize:none;

}

.section{

margin-top:30px;

}

.section h3{

margin-bottom:12px;
color:#0f4c81;

}

.checkbox-grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:10px;

}

.checkbox-grid label{

background:#f8f9fa;
padding:10px;
border-radius:10px;
cursor:pointer;
transition:.25s;

}

.checkbox-grid label:hover{

background:#eaf3ff;

}

.preview{

margin-top:15px;
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:4px solid #0f4c81;

}

.progress{

margin-top:25px;
background:#ddd;
height:12px;
border-radius:50px;
overflow:hidden;

}

.progress div{

width:0%;
height:100%;
background:#0f4c81;
transition:.4s;

}

#progressText{

margin-top:8px;
font-weight:bold;
color:#555;

}

button{

margin-top:30px;
width:100%;
padding:15px;
background:#0f4c81;
color:white;
font-size:17px;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#08365c;

}

</style>

</head>

<body>

<div class="container">

<h2>Complete Tutor Profile</h2>

<form id="profileForm">

<div class="grid">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="tel"
id="phone"
placeholder="Mobile Number">

<select id="gender">

<option value="">Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

<select id="qualification">

<option value="">Qualification</option>

<option>Graduation</option>

<option>Post Graduation</option>

<option>B.Ed</option>

<option>M.Ed</option>

<option>B.Tech</option>

<option>M.Tech</option>

<option>MBBS</option>

<option>CA</option>

<option>Other</option>

</select>

<select id="experience">

<option value="">Experience</option>

<option>0-1 Years</option>

<option>1-3 Years</option>

<option>3-5 Years</option>

<option>5-10 Years</option>

<option>10+ Years</option>

</select>

<input
type="text"
id="city"
placeholder="City">

<input
type="text"
id="area"
placeholder="Teaching Area">

<input
type="number"
id="fees"
placeholder="Fees Per Hour">

</div>

<<div class="section">

<h3>Subjects</h3>

<div class="checkbox-grid">

<label><input type="checkbox" name="subjects" value="Maths"> Maths</label>

<label><input type="checkbox" name="subjects" value="Physics"> Physics</label>

<label><input type="checkbox" name="subjects" value="Chemistry"> Chemistry</label>

<label><input type="checkbox" name="subjects" value="Biology"> Biology</label>

<label><input type="checkbox" name="subjects" value="English"> English</label>

<label><input type="checkbox" name="subjects" value="Science"> Science</label>

<label><input type="checkbox" name="subjects" value="Social Science"> Social Science</label>

<label><input type="checkbox" name="subjects" value="Computer"> Computer</label>

<label><input type="checkbox" name="subjects" value="Hindi"> Hindi</label>

<label><input type="checkbox" name="subjects" value="Accounts"> Accounts</label>

<label><input type="checkbox" name="subjects" value="Economics"> Economics</label>

<label><input type="checkbox" name="subjects" value="Business Studies"> Business Studies</label>

</div>

</div>


<div class="section">

<h3>Classes</h3>

<div class="checkbox-grid">

<label><input type="checkbox" name="classes" value="LKG-5"> LKG–5</label>

<label><input type="checkbox" name="classes" value="6-8"> 6–8</label>

<label><input type="checkbox" name="classes" value="9-10"> 9–10</label>

<label><input type="checkbox" name="classes" value="11-12"> 11–12</label>

<label><input type="checkbox" name="classes" value="College"> College</label>

<label><input type="checkbox" name="classes" value="Competitive Exams"> Competitive Exams</label>

</div>

</div>


<div class="section">

<h3>Board</h3>

<div class="checkbox-grid">

<label><input type="checkbox" name="board" value="CBSE"> CBSE</label>

<label><input type="checkbox" name="board" value="ICSE"> ICSE</label>

<label><input type="checkbox" name="board" value="State Board"> State Board</label>

<label><input type="checkbox" name="board" value="IB"> IB</label>

<label><input type="checkbox" name="board" value="Cambridge"> Cambridge</label>

</div>

</div>


<div class="section">

<h3>Teaching Mode</h3>

<div class="checkbox-grid">

<label><input type="checkbox" name="mode" value="Home Tuition"> Home Tuition</label>

<label><input type="checkbox" name="mode" value="Online"> Online</label>

<label><input type="checkbox" name="mode" value="Institute"> Institute</label>

</div>

</div>


<div class="section">

<h3>Languages</h3>

<div class="checkbox-grid">

<label><input type="checkbox" name="languages" value="Hindi"> Hindi</label>

<label><input type="checkbox" name="languages" value="English"> English</label>

<label><input type="checkbox" name="languages" value="Urdu"> Urdu</label>

<label><input type="checkbox" name="languages" value="Punjabi"> Punjabi</label>

</div>

</div>


<div class="section">

<h3>About Yourself</h3>

<textarea
id="about"
placeholder="Write about yourself..."></textarea>

</div>


<div class="section">

<h3>Profile Photo</h3>

<input
type="file"
id="photo"
accept="image/*">

<br><br>

<img

id="preview"

class="preview"

src="assets/logo/logo.png">

</div>


<div class="section">

<h3>Free Demo</h3>

<label>

<input
type="checkbox"
id="demoAvailable">

Free Demo Available

</label>

</div>


<div class="section">

<h3>Profile Completion</h3>

<div class="progress">

<div id="progressBar"></div>

</div>

<p id="progressText">

0% Complete

</p>

</div>


<button

type="submit"

id="saveBtn">

💾 Save Profile

</button>

</form>

</div>

<script type="module" src="js/profile.js"></script>

</body>

</html>
