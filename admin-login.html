<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | TutorNest</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#2563eb,#0f172a);

}

.card{

width:420px;

background:#fff;

border-radius:20px;

padding:40px;

box-shadow:0 20px 50px rgba(0,0,0,.25);

}

.logo{

font-size:34px;

text-align:center;

margin-bottom:10px;

}

h2{

text-align:center;

margin-bottom:5px;

color:#0f172a;

}

p{

text-align:center;

color:#64748b;

margin-bottom:30px;

}

.input{

width:100%;

padding:14px;

margin-bottom:18px;

border:1px solid #dbe3ef;

border-radius:10px;

font-size:15px;

outline:none;

}

.input:focus{

border-color:#2563eb;

}

button{

width:100%;

padding:14px;

background:#2563eb;

color:#fff;

border:none;

border-radius:10px;

font-size:16px;

cursor:pointer;

font-weight:600;

transition:.3s;

}

button:hover{

background:#1d4ed8;

}

#error{

margin-top:15px;

text-align:center;

color:red;

font-size:14px;

}

</style>

</head>

<body>
    
<div class="card">

<div class="logo">🎓</div>

<h2>Admin Login</h2>

<p>TutorNest Administration Panel</p>

<input
type="email"
id="email"
class="input"
placeholder="Admin Email">

<input
type="password"
id="password"
class="input"
placeholder="Password">

<button id="loginBtn">

Login

</button>

<div id="error"></div>

</div>

<script type="module" src="js/admin-dashboard-v2.js"></script>

</body>
</html>
