<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Profile | TutorNest</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

.container{

max-width:1100px;

margin:40px auto;

padding:20px;

}

.profile{

background:white;

border-radius:20px;

padding:30px;

display:grid;

grid-template-columns:300px 1fr;

gap:40px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.left{

text-align:center;

}

.left img{

width:220px;

height:220px;

border-radius:50%;

object-fit:cover;

border:6px solid #0d6efd;

}

.left h2{

margin-top:20px;

}

.left p{

color:#666;

margin-top:8px;

}

.right h3{

margin-bottom:20px;

color:#0d6efd;

}

.info{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

margin-bottom:25px;

}

.card{

background:#f8f9fa;

padding:15px;

border-radius:12px;

}

.about{

background:#f8f9fa;

padding:20px;

border-radius:15px;

margin-top:20px;

line-height:1.7;

}

.buttons{

margin-top:30px;

display:flex;

gap:15px;

flex-wrap:wrap;

}

.buttons a{

padding:14px 24px;

text-decoration:none;

color:white;

border-radius:10px;

font-weight:bold;

}

.call{

background:#0d6efd;

}

.whatsapp{

background:#25D366;

}

.demo{

background:#ff9800;

}

@media(max-width:768px){

.profile{

grid-template-columns:1fr;

}

.info{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="container">

<div class="profile">

<div class="left">

<img id="photo" src="assets/logo/logo.png">

<h2 id="name">Loading...</h2>

<p id="qualification"></p>

</div>

<div class="right">

<h3>Tutor Information</h3>

<div class="info">

<div class="card">
<b>Subjects</b>
<p id="subjects"></p>
</div>

<div class="card">
<b>Classes</b>
<p id="classes"></p>
</div>

<div class="card">
<b>Experience</b>
<p id="experience"></p>
</div>

<div class="card">
<b>Fees</b>
<p id="fees"></p>
</div>

<div class="card">
<b>Area</b>
<p id="area"></p>
</div>

<div class="card">
<b>Mode</b>
<p id="mode"></p>
</div>

</div>

<div class="about">

<h3>About Tutor</h3>

<p id="about"></p>

</div>

<div class="buttons">

<a id="callBtn"
class="call"
href="#">📞 Call</a>

<a id="whatsappBtn"
class="whatsapp"
target="_blank"
href="#">💬 WhatsApp</a>

<a
class="demo"
href="contact.html">

🎓 Book Free Demo

</a>

</div>

</div>

</div>

</div>

<script type="module" src="js/teacher.js"></script>

</body>
</html>
