<!DOCTYPE html>
<html lang="en">

<head>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

<div class="logo">
<a href="index.html">TutorNest</a>

</div>

</nav>

<!-- PROFILE -->

<section class="teacher-profile">

<div class="profile-card">

<img
id="profileImage"
src="assets/images/default-user.png"
alt="Tutor">

<div class="profile-info">

<h1 id="teacherName">

Loading...

</h1>

<p id="qualification">

Qualification

<p id="experience">

Experience

</p>

<p id="location">

📍 Lucknow

<div class="verified">

<i class="fa-solid fa-circle-check"></i>

Verified Tutor

</div>

</div>

</div>

</section>

<!-- ABOUT -->

<section class="teacher-section">

<h2>About Tutor</h2>

<p id="about">

No description available.

</p>

</section>

<!-- SUBJECTS -->

<section class="teacher-section">

<h2>Subjects & Monthly Fees</h2>

<div id="subjectContainer">

</div>

</section>

<!-- CLASSES -->

<section class="teacher-section">

<h2>Classes</h2>

<div id="classContainer">

</div>

</section>

<!-- MODE -->

<section class="teacher-section">

<h2>Teaching Mode</h2>

<p id="mode">

Home Tuition

</p>

</section>

<!-- LANGUAGES -->

<section class="teacher-section">

<h2>Languages</h2>

<p id="languages">

Hindi, English

</p>

</section>

<!-- BUTTONS -->

<section class="teacher-buttons">

<button id="demoBtn">

Request Demo

</button>

<button id="whatsappBtn">

<i class="fa-brands fa-whatsapp"></i>

WhatsApp
